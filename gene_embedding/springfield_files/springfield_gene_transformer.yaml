kind: Job
apiVersion: batch/v1
metadata:
  name: gene-embedding
spec:
  template:
    spec:
      hostIPC: true
      containers:
      - name: gene-embedding
        image: "theodorross/tensorflow-experiments:cuda-v0.3"
        command: ["python"]
        args:
        - "train_gene_autoencoder.py"
        - "--platform=springfield"
        - "--dataset=dev"
        - "--n-sequence-tokens=21"
        - "--latent-dim=6"
        - "--embedding-dim=6"
        - "--learning-rate=1e-3"
        - "--learning-rate-decay=0.01"
        - "--learning-rate-decay-start=500"
        - "--masking-rate=0.0"
        - "--dropout-rate=0.0"
        - "--batch-size=30"
        - "--epochs=3000"
        - "--patience=3000"
        - "--encoder-layers=10"
        - "--decoder-layers=1"
        - "--key-dim=16"
        - "--num-heads=10"
        - "--ff-dim=32"
        - "--max-seq-length=99"
        workingDir: /storage/genome_transformer_dev/gene_embedding
        volumeMounts:
        - name: storage
          mountPath: /storage
        resources:
          limits:
            memory: "32Gi"
        env: 
        - name: WANDB_API_KEY
          valueFrom: 
            secretKeyRef: 
              name: wandb
              key: apikey
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
      restartPolicy: OnFailure
  backoffLimit: 0