kind: Job
apiVersion: batch/v1
metadata:
  name: gene-embedding
spec:
  template:
    spec:
      hostIPC: true
      containers:
      - name: gene-embedding
        image: "theodorross/tensorflow-experiments:cuda-v0.3"
        command: ["python"]
        args:
        - "train_gene_autoencoder.py"
        - "--platform=springfield"
        - "--dataset=full"
        - "--n-sequence-tokens=3"
        - "--latent-dim=256"
        - "--embedding-dim=6"
        - "--learning-rate=1e-3"
        - "--learning-rate-decay=0.01"
        - "--learning-rate-decay-start=75"
        - "--masking-rate=0.01"
        - "--batch-size=64"
        - "--epochs=500"
        - "--patience=50"
        - "--encoder-layers=12"
        - "--decoder-layers=12"
        - "--key-dim=64"
        - "--num-heads=8"
        - "--ff-dim=1024"
        - "--max-seq-length=1000"
        workingDir: /storage/genome_transformer_dev/gene_embedding
        volumeMounts:
        - name: storage
          mountPath: /storage
        resources:
          limits:
            memory: "32Gi"
        env: 
        - name: WANDB_API_KEY
          valueFrom: 
            secretKeyRef: 
              name: wandb
              key: apikey
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
      restartPolicy: OnFailure
  backoffLimit: 0