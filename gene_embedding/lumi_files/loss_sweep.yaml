program: train_gene_autoencoder.py
name: gene-embedding-loss-sweep
entity: theodor-a-ross
project: gene-encoder
method: bayes
metric:
  goal: maximize
  name: epoch/val_COG_category_accuracy
parameters:
  functional_loss_weight:
    min: 0.0
    max: 1.0
  reconstruction_loss_weight:
    min: 0.0
    max: 1.0
  clustering_loss_weight:
    min: 0.0
    max: 1.0
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--batch-size"
  - "128"
  - "--decode-length"
  - "5000"
  - "--decoder-layers"
  - "2"
  - "--dropout-rate"
  - "0.025"
  - "--embedding-dim"
  - "64"
  - "--encoder-layers"
  - "40"
  - "--epochs"
  - "2000"
  - "--ff-dim"
  - "32"
  - "--key-dim"
  - "16"
  - "--latent-dim"
  - "128"
  - "--learning-rate"
  - "3e-4"
  - "--learning-rate-decay"
  - "0.99"
  - "--learning-rate-decay-start"
  - "500"
  - "--masking-rate"
  - "0.03"
  - "--max-seq-length"
  - "5000"
  - "--n-sequence-tokens"
  - "16"
  - "--num-heads"
  - "8"
  - "--patience"
  - "100"
  - "--platform"
  - "LUMI"
  - "--seq-length-steps"
  - "1"
  - ${args}