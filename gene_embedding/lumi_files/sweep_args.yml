program: train_gene_autoencoder.py
name: gene_embedding_sweep
entity: theodor-a-ross
project: gene-encoder
method: bayes
metric:
  goal: minimize
  name: validation_loss
parameters:
  embedding_dim:
    values: [4, 8]
  latent_dim:
    values: [16, 32, 64]
  encoder_layers:
    values: [4, 8, 10, 20]
  decoder_layers:
    values: [1, 2, 4]
  key_dim:
    values: [16, 32]
  num_heads:
    values: [12, 24]
  dropout_rate:
    min: 0.0
    max: 0.05
  max_length:
    values: [300]
  masking_rate:
    min: 0.0
    max: 0.05
  learning_rate:
    min: 0.0001
    max: 0.01
  n_sequence_tokens:
    values: [2, 4, 8, 16]
  patience:
    values: [150]
  batch_size:
    values: [64,128,256]
  epochs:
    values: [20]
  learning_rate_decay:
    values: [0.95]
  learning_rate_decay_start:
    values: [100, 200]
  seq_length_steps:
    values: [1]
