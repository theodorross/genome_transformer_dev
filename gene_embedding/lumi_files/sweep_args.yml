program: train_gene_autoencoder.py
name: gene-embedding-sweep-300
entity: theodor-a-ross
project: gene-encoder
method: bayes
metric:
  goal: minimize
  name: epoch/val_loss
parameters:
  embedding-dim:
    values: [4, 8]
  latent-dim:
    values: [16, 32, 64]
  encoder-layers:
    values: [4, 8, 10, 20]
  decoder-layers:
    values: [1, 2, 4]
  key-dim:
    values: [16, 32]
  num-heads:
    values: [12, 24]
  dropout-rate:
    min: 0.0
    max: 0.05
  decode-length:
    values: [300]
  max-seq-length:
    values: [300]
  masking-rate:
    min: 0.0
    max: 0.05
  learning-rate:
    min: 0.00001
    max: 0.0001
  n-sequence-tokens:
    values: [2, 4, 8, 16]
  patience:
    values: [150]
  batch-size:
    values: [256]
  epochs:
    values: [2000]
  learning-rate-decay:
    values: [0.95]
  learning-rate-decay-start:
    values: [100, 200]
  seq-length-steps:
    values: [1]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--platform"
  - "LUMI"
  - ${args}