program: train_gene_autoencoder.py
name: gene-embedding-sweep-5000
entity: theodor-a-ross
project: gene-encoder
method: bayes
metric:
  goal: minimize
  name: epoch/val_loss
parameters:
  embedding-dim:
    values: [4, 8, 16]
  latent-dim:
    values: [16, 32, 64, 128]
  encoder-layers:
    values: [4, 8, 10, 20, 30, 40]
  decoder-layers:
    values: [1, 2, 4, 6, 8]
  dropout-rate:
    min: 0.0
    max: 0.05
  masking-rate:
    min: 0.0
    max: 0.05
  learning-rate:
    min: 0.00001
    max: 0.0001
  n-sequence-tokens:
    values: [8, 16, 32]
  learning-rate-decay:
    values: [0.95,0.99]
  seq-length-steps:
    values: [2,3,5]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--platform"
  - "LUMI"
  - --key-dim 32
  - --num-heads 24
  - --decode-length 300
  - --max-seq-length 5000
  - --patience 150
  - --batch-size 256
  - --epochs 2000
  - --learning-rate-decay-start 200
  - ${args}