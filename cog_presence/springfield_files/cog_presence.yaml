kind: Job
apiVersion: batch/v1
metadata:
  name: contig-embedding-cog-presence
spec:
  template:
    spec:
      hostIPC: true
      containers:
      - name: contig-embedding-cog-presence
        image: "theodorross/tensorflow-experiments:latest"
        command: ["python"]
        args: ["cog-presence-test.py", "--platform", "Springfield", "--embedding-dim", "1024", "--label-column", "Vancomycin_res"]
        workingDir: /storage/genome_transformer_dev/cog_presence
        volumeMounts:
        - name: storage
          mountPath: /storage
        resources:
          limits:
            memory: "32Gi"
        env: 
        - name: WANDB_API_KEY
          valueFrom: 
            secretKeyRef: 
              name: wandb
              key: apikey
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
      restartPolicy: OnFailure
  backoffLimit: 0