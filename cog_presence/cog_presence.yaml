kind: Job
apiVersion: batch/v1
metadata:
  name: contig-embedding-cog-presence
spec:
  template:
    spec:
      hostIPC: true
      containers:
      - name: contig-embedding-cog-presence
        image: "docker pull tensorflow/tensorflow:2.14.0-gpu"
        command: ["python cog_presence-test.py"]
        args: ["--platform","Springfield","--embedding-dim",1024,"--label-column","Vancomycin_res"]
        workingDir: /storage/genome_embedding/cog_presence
        volumeMounts:
        - name: storage
          mountPath: /storage
        resources:
          limits:
            memory: 32Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
              claimName: storage
      restartPolicy: OnFailure
  backoffLimit: 0
